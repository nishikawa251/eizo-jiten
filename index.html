<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>映像表現辞典</title>
<meta name="description" content="手法の名前からも、作例の絵からも引ける映像表現の辞典。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 制作現場の道具。静かで速い、引く辞書。
   IDEA: ライトボックスに並べたコンタクトシート。気になるコマに赤のグリースペンシルで印をつける。
   PICTURE: 画面いっぱいのフィルムコマ（サムネイル）の格子。それ自体が道具。
   COLOUR and TYPE: 乳白のライトボックス／夜は暗室。黒いフィルム枠、赤ペン #d7262b 一色。Zen Kaku Gothic New。
   LAYOUT: 細い見出し帯と操作列。「名前で引く」は辞典の項目（見出し語・読み・説明・関連語と作例のコマ）、
           「絵で引く」はコマの格子。作例を選ぶと手法名を大きく出すシートが開く。 */
:root{color-scheme:light dark;
--bg:light-dark(#efeee9,#0f1011);--ink:light-dark(#151515,#ecebe6);--sub:light-dark(#5d5d58,#a3a29c);
--film:light-dark(#18181a,#000);--line:light-dark(#d4d2ca,#2a2b2e);--chip:light-dark(#fff,#1a1b1d);
--red:light-dark(#d7262b,#ff4a46);--sheet:light-dark(#fbfaf7,#17181a);--barh:0px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overflow-x:clip}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
header{padding:28px max(4vw,16px) 8px}
h1{margin:0;font-size:clamp(30px,4.4vw,46px);line-height:1.05;font-weight:900;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--red)}
.lead{margin:10px 0 0;color:var(--sub);max-width:62ch;text-wrap:pretty;word-break:auto-phrase}
#stat{display:inline-block}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px max(4vw,16px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px}
.search input{flex:1;border:0;background:none;font-size:16px;outline:none;min-height:42px}
.search:focus-within{border-color:var(--red)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:none;padding:0 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tgl{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.tgl[aria-pressed=true]{border-color:var(--red);color:var(--red);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:14px;min-height:36px}
.chips button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
button:focus-visible,a:focus-visible,.frame:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{padding:16px max(4vw,16px) 40px;max-width:1500px;margin:0 auto}
.count{font-size:13px;color:var(--sub);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px 14px}
.frame{background:var(--film);padding:13px 6px 6px;border-radius:3px;cursor:pointer;position:relative;border:0;text-align:left;color:#eee;display:flex;flex-direction:column;transition:transform .15s}
.frame::before,.frame::after{content:"";position:absolute;left:6px;right:6px;height:5px;background:repeating-linear-gradient(90deg,transparent 0 5px,light-dark(#efeee9,#3a3a3a) 5px 11px,transparent 11px 16px)}
.frame::before{top:4px}
.frame img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.cap{padding:7px 3px 3px;font-size:12.5px;line-height:1.4;color:#cfcfca;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;padding:4px 3px 3px}
.tags span{font-size:12px;background:#fff;color:#111;padding:1px 7px;border-radius:3px;font-weight:700}
.frame:hover{transform:translateY(-2px)}
.frame:hover img{outline:2px solid var(--red);outline-offset:-2px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.strip .frame{flex:0 0 200px;scroll-snap-align:start}
.empty{padding:60px 0;text-align:center;color:var(--sub)}

/* 辞典 */
.grp{margin:0 0 28px}
.gh{position:sticky;top:var(--barh);z-index:3;background:var(--bg);margin:0;padding:10px 0 8px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
.gh b{font-size:22px;font-weight:900;line-height:1.2}
.gh span{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.entry{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px 32px;padding:22px 0;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--barh) + 56px)}
.entry .txt{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.path{font-size:13px;color:var(--sub)}
.entry h3{margin:0;font-size:clamp(24px,2.6vw,30px);font-weight:900;line-height:1.25;overflow-wrap:anywhere;text-wrap:balance;word-break:auto-phrase}
.entry.hit .hw{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--red) 35%,transparent) 62%)}
.reads{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--sub)}
.reads .en{letter-spacing:.02em}
.def{margin:6px 0 0;font-size:15.5px;line-height:1.8;max-width:40em;text-wrap:pretty;word-break:auto-phrase}
.def.none,.def.x{color:var(--sub);font-size:14.5px}
.chk{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 6px;line-height:1.7;vertical-align:1px;white-space:nowrap;cursor:help}
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 0}
.rel>span{font-size:12px;color:var(--sub);margin-right:2px}
.rel a{font-size:13.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:3px 11px}
.rel a:hover{border-color:var(--red);color:var(--red)}
.entry .strip{align-self:start}

/* シート */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.veil.on{display:flex}
.sheet{background:var(--sheet);color:var(--ink);width:min(1080px,100%);max-height:92vh;overflow:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.sheet .pic{background:var(--film);padding:18px 10px 10px;position:relative}
.player{width:100%;aspect-ratio:16/9;background:#000}.player iframe{width:100%;height:100%;border:0;display:block}
.seek{border:1px solid var(--red);color:var(--red);background:none;border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer;margin-left:4px}
.sheet .pic .vt{color:#ddd;font-size:14px;margin:10px 2px 6px;line-height:1.45}
.yt{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;text-decoration:none;border-radius:8px;padding:0 14px;min-height:44px;font-weight:700;margin:4px 2px}
.info{padding:22px 22px 18px;display:flex;flex-direction:column;gap:22px}
.close{position:sticky;top:0;align-self:flex-end;border:1px solid var(--line);background:var(--chip);border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:20px;line-height:1;margin:-8px -8px -40px 0}
.word{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.word h3{margin:2px 0 4px;font-size:clamp(26px,3.4vw,36px);line-height:1.15;font-weight:900;text-wrap:balance;word-break:auto-phrase}
.word h3 mark{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--red) 35%,transparent) 62%);color:inherit}
.word .def{font-size:15px;margin:4px 0 0}
.word .note{margin:8px 0 0;font-size:15px;border-left:3px solid var(--red);padding-left:10px;color:var(--sub);text-wrap:pretty}
.toj{margin-top:8px;font-size:14px;color:var(--red);font-weight:700;text-decoration:none}
.toj:hover{text-decoration:underline}
.word .more{font-size:13px;color:var(--sub);margin-top:10px}
.mini{display:flex;gap:8px;overflow-x:auto;padding:6px 0;max-width:100%}
.mini button{flex:0 0 112px;border:0;padding:0;background:none;cursor:pointer;text-align:left}
.mini img{width:112px;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:3px}
footer{padding:20px max(4vw,16px) 40px;color:var(--sub);font-size:13px;border-top:1px solid var(--line)}
footer p{margin:0 0 6px;max-width:80ch;text-wrap:pretty;word-break:auto-phrase}
footer a{color:inherit}
@media(max-width:860px){.entry{grid-template-columns:1fr}}
@media(max-width:700px){.bar{position:static}.sheet{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px}.strip .frame{flex-basis:160px}.seg button{padding:0 11px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.frame{transition:none}.frame:hover{transform:none}}
</style>
</head>
<body>
<header>
<h1>映像表現<span>辞典</span></h1>
<p class="lead">手法の名前からも、作例の絵からも引ける映像表現の辞典です。<span id="stat"></span></p>
</header>
<div class="bar">
  <div class="row">
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="手法名・読み・作品名で探す" autocomplete="off" aria-label="検索"></label>
    <div class="seg" role="group" aria-label="引き方">
      <button id="vJiten" type="button" aria-pressed="true">名前で引く</button>
      <button id="vWorks" type="button" aria-pressed="false">絵で引く</button>
    </div>
    <div class="seg" id="sortSeg" role="group" aria-label="並び順">
      <button id="oCat" type="button" aria-pressed="true">分類順</button>
      <button id="oKana" type="button" aria-pressed="false">五十音順</button>
    </div>
    <button class="tgl" id="names" type="button" aria-pressed="false" hidden>名前も表示</button>
    <button class="tgl" id="shuffle" type="button" aria-pressed="false" hidden>シャッフル</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="大分類"></div>
</div>
<main id="main"><p class="empty">読み込み中…</p></main>
<footer>
<p>出典：<a href="https://scrapbox.io/movieclub/%E6%98%A0%E5%83%8F%E8%A1%A8%E7%8F%BE%E8%BE%9E%E5%85%B8(%E6%9C%AA%E6%95%B4%E7%90%86)">映像表現辞典(未整理)｜movieclub（Scrapbox）</a> をもとに、YouTubeで見られる作例だけを並べています（2026年11月25日時点。削除済みの動画やYouTube以外の作例は除外）。</p>
<p>説明文のうち出典にないものは、このページで書き足しました。「要確認」の印がある説明は、作例から推して書いた下書きです。</p>
<p>作例を選ぶと、ページ内で動画が再生されます。</p>
</footer>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="表現の名前"></div></div>
<script>
{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('eizo-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('eizo-'+k,JSON.stringify(v))}catch(e){}}};
const hira=s=>String(s??'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>hira(String(s??'').normalize('NFKC').toLowerCase()).replace(/\s+/g,' ');
const ROWS=[['あ','あいうえお'],['か','かきくけこ'],['さ','さしすせそ'],['た','たちつてと'],['な','なにぬねの'],['は','はひふへほ'],['ま','まみむめも'],['や','やゆよ'],['ら','らりるれろ'],['わ','わをん']];
const SMALL={'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お','っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ'};
const rowOf=r=>{let c=hira(r).normalize('NFD').charAt(0);c=SMALL[c]||c;const f=ROWS.find(x=>x[1].includes(c));return f?f[0]:'他'};
const hasKanji=s=>/[㐀-鿿々A-Za-z0-9]/.test(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMPTY='<p class="empty">見つかりませんでした。言葉を変えてみてください。</p>';

let T=[],V=new Map(),SECS=[],BY=new Map();
const th=id=>'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/mqdefault.jpg';
const st={view:store.get('view','jiten')==='works'?'works':'jiten',order:store.get('order','cat')==='kana'?'kana':'cat',names:!!store.get('names',false),sec:'',row:'',q:'',shuffle:false,ord:null};

const tsec=n=>{const m=String(n).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):0};
const ytUrl=(id,note)=>{const t=tsec(note);return 'https://www.youtube.com/watch?v='+encodeURIComponent(id)+(t?'&t='+t+'s':'')};
const embedUrl=(id,note)=>{const t=tsec(note);return 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0&playsinline=1'+(t?'&start='+t:'')};
const pathOf=t=>[t.s,t.b].filter(Boolean).join(' › ');
const href=n=>'#'+encodeURIComponent(n);

function frame(id,title,showTags){
  const v=V.get(id);title=title||v.title;
  const tags=showTags?'<span class="tags">'+v.techs.map(x=>'<span>'+esc(T[x.i].t)+'</span>').join('')+'</span>':'';
  return '<button class="frame" type="button" data-id="'+esc(id)+'" aria-label="'+esc(title)+'"><img loading="lazy" alt="" src="'+esc(th(id))+'"><span class="cap">'+esc(title)+'</span>'+tags+'</button>';
}
function readsHtml(t){
  const a=[];
  if(hasKanji(t.t))a.push('<span class="yomi">'+esc(t.r)+'</span>');
  if(t.e)a.push('<span class="en" lang="en">'+esc(t.e)+'</span>');
  return a.length?'<span class="reads">'+a.join('')+'</span>':'';
}
function defHtml(t){
  let h=t.def?'<p class="def">'+esc(t.def)+(t.chk?'<span class="chk" title="出典に説明がないため、作例から推して書いた下書きです">要確認</span>':'')+'</p>':'<p class="def none">説明はまだありません。</p>';
  if(t.x)h+='<p class="def x">補足：'+esc(t.x)+'</p>';
  return h;
}
function inView(t){
  if(st.q&&!t.hay.includes(st.q))return false;
  return st.order==='cat'?(!st.sec||t.s===st.sec):(!st.row||t.row===st.row);
}
function entry(t){
  const path=st.order==='cat'?t.b:pathOf(t);
  return '<article class="entry" id="w'+t.i+'"><div class="txt">'+
    (path?'<span class="path">'+esc(path)+'</span>':'')+
    '<h3><span class="hw">'+esc(t.t)+'</span></h3>'+readsHtml(t)+defHtml(t)+
    (t.rel.length?'<p class="rel"><span>関連</span>'+t.rel.map(n=>'<a href="'+esc(href(n))+'">'+esc(n)+'</a>').join('')+'</p>':'')+
    '</div><div class="strip">'+t.v.map(v=>frame(v.id,v.title,false)).join('')+'</div></article>';
}
function renderJiten(){
  const list=T.filter(inView);
  const groups=[];
  if(st.order==='cat'){
    SECS.forEach(s=>{const items=list.filter(t=>t.s===s);if(items.length)groups.push({name:s,items})});
  }else{
    const sorted=[...list].sort((a,b)=>a.r.localeCompare(b.r,'ja')||a.t.localeCompare(b.t,'ja'));
    [...ROWS.map(r=>r[0]),'他'].forEach(k=>{const items=sorted.filter(t=>t.row===k);if(items.length)groups.push({name:k,items})});
  }
  $('main').innerHTML='<p class="count">'+list.length+'の手法</p>'+(groups.length?groups.map(g=>'<section class="grp"><h2 class="gh"><b>'+esc(g.name)+'</b><span>'+g.items.length+'</span></h2>'+g.items.map(entry).join('')+'</section>').join(''):EMPTY);
}
function renderWorks(){
  let ids=[...V.keys()].filter(id=>{const v=V.get(id);
    if(st.sec&&!v.techs.some(x=>T[x.i].s===st.sec))return false;
    return !st.q||v.hay.includes(st.q)||v.techs.some(x=>T[x.i].hayT.includes(st.q));});
  if(st.shuffle&&st.ord)ids.sort((a,b)=>st.ord.get(a)-st.ord.get(b));
  $('main').innerHTML='<p class="count">'+ids.length+'本の作例</p>'+(ids.length?'<div class="grid">'+ids.map(id=>frame(id,'',st.names)).join('')+'</div>':EMPTY);
}
function chips(){
  const kana=st.view==='jiten'&&st.order==='kana';
  const items=kana?['',...ROWS.map(r=>r[0]).filter(k=>T.some(t=>t.row===k))]:['',...SECS];
  const cur=kana?st.row:st.sec;
  $('chips').setAttribute('aria-label',kana?'五十音':'大分類');
  $('chips').innerHTML=items.map(s=>'<button type="button" data-k="'+esc(s)+'" aria-pressed="'+(cur===s)+'">'+esc(s?(kana?s+'行':s):'すべて')+'</button>').join('');
}
function render(){
  const j=st.view==='jiten';
  $('vJiten').setAttribute('aria-pressed',j);$('vWorks').setAttribute('aria-pressed',!j);
  $('sortSeg').hidden=!j;$('names').hidden=j;$('shuffle').hidden=j;
  $('oCat').setAttribute('aria-pressed',st.order==='cat');$('oKana').setAttribute('aria-pressed',st.order==='kana');
  $('names').setAttribute('aria-pressed',st.names);$('shuffle').setAttribute('aria-pressed',st.shuffle);
  chips();
  if(j)renderJiten();else renderWorks();
}
function toTop(){const m=$('main'),y=m.getBoundingClientRect().top+scrollY-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--barh')||0);if(scrollY>y)scrollTo({top:y})}

let opener=null;
function open(id){
  const v=V.get(id);if(!v)return;
  if(!$('veil').classList.contains('on'))opener=document.activeElement;
  const first=v.techs[0];
  const words=v.techs.map(x=>{const t=T[x.i];
    const others=t.v.filter(o=>o.id!==id);
    return '<div class="word"><span class="path">'+esc(pathOf(t))+'</span><h3><mark>'+esc(t.t)+'</mark></h3>'+readsHtml(t)+defHtml(t)+
      (x.n?'<p class="note">この作品では：'+esc(x.n)+(tsec(x.n)?' <button class="seek" type="button" data-id="'+esc(id)+'" data-n="'+esc(x.n)+'">ここから再生</button>':'')+'</p>':'')+
      '<a class="toj" href="'+esc(href(t.t))+'">辞典で見る →</a>'+
      (others.length?'<div class="more">「'+esc(t.t)+'」の他の作例</div><div class="mini">'+others.map(o=>'<button type="button" data-id="'+esc(o.id)+'" title="'+esc(o.title)+'"><img loading="lazy" alt="'+esc(o.title)+'" src="'+esc(th(o.id))+'"></button>').join('')+'</div>':'')+'</div>';}).join('');
  $('sheet').innerHTML='<div class="pic"><div class="player"><iframe src="'+esc(embedUrl(id,first.n))+'" title="'+esc(v.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><div class="vt">'+esc(v.title)+'</div><a class="yt" href="'+esc(ytUrl(id,first.n))+'" target="_blank" rel="noopener">YouTubeで開く</a></div><div class="info"><button class="close" id="close" type="button" aria-label="閉じる">×</button>'+words+'</div>';
  $('veil').classList.add('on');document.body.classList.add('lock');$('sheet').scrollTop=0;$('close').focus();
}
function closeSheet(restore){
  if(!$('veil').classList.contains('on'))return;
  $('veil').classList.remove('on');document.body.classList.remove('lock');$('sheet').innerHTML='';
  if(restore&&opener&&document.contains(opener))opener.focus({preventScroll:true});
  opener=null;
}
function goHash(){
  let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){return}
  if(!h||!BY.has(h))return;
  const t=T[BY.get(h)];
  closeSheet(false);
  if(st.view!=='jiten'){st.view='jiten';store.set('view','jiten')}
  if(!inView(t)){st.q='';$('q').value='';st.sec='';st.row=''}
  render();
  const el=$('w'+t.i);if(!el)return;
  el.classList.add('hit');
  const far=Math.abs(el.getBoundingClientRect().top)>innerHeight*1.5;
  el.scrollIntoView({block:'start',behavior:reduce||far?'auto':'smooth'});
}

$('q').addEventListener('input',e=>{st.q=norm(e.target.value.trim());render()});
$('vJiten').onclick=()=>{st.view='jiten';store.set('view','jiten');render();toTop()};
$('vWorks').onclick=()=>{st.view='works';store.set('view','works');render();toTop()};
$('oCat').onclick=()=>{st.order='cat';store.set('order','cat');render();toTop()};
$('oKana').onclick=()=>{st.order='kana';store.set('order','kana');render();toTop()};
$('names').onclick=()=>{st.names=!st.names;store.set('names',st.names);render()};
$('shuffle').onclick=()=>{st.shuffle=!st.shuffle;if(st.shuffle)st.ord=new Map([...V.keys()].map(k=>[k,Math.random()]));render()};
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(st.view==='jiten'&&st.order==='kana')st.row=b.dataset.k;else st.sec=b.dataset.k;render();toTop()});
$('main').addEventListener('click',e=>{const b=e.target.closest('.frame');if(b)open(b.dataset.id)});
$('veil').addEventListener('click',e=>{
  if(e.target.id==='veil'||e.target.id==='close')return closeSheet(true);
  const k=e.target.closest('.seek');if(k){const f=$('sheet').querySelector('iframe');if(f)f.src=embedUrl(k.dataset.id,k.dataset.n);return}
  const b=e.target.closest('.mini button');if(b)open(b.dataset.id)});
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');if(!a)return;
  e.preventDefault();history.pushState(null,'',a.getAttribute('href'));goHash()});
addEventListener('popstate',goHash);
addEventListener('hashchange',goHash);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet(true)});

const bar=document.querySelector('.bar');
const setBar=()=>document.documentElement.style.setProperty('--barh',(getComputedStyle(bar).position==='sticky'?bar.offsetHeight:0)+'px');
new ResizeObserver(setBar).observe(bar);addEventListener('resize',setBar);setBar();

Promise.all([
  fetch('data/techs.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}),
  fetch('data/jiten.json').then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([techs,J])=>{
  T=techs;
  T.forEach((t,i)=>{
    const j=J[t.t]||{};
    t.i=i;t.r=j.r||hira(t.t);t.e=j.e||'';t.def=t.d||j.d||'';t.chk=!t.d&&!!j.d&&!!j.k;t.x=t.d?(j.x||''):'';
    t.row=rowOf(t.r);
    if(!SECS.includes(t.s))SECS.push(t.s);
    if(!BY.has(t.t))BY.set(t.t,i);
    t.hayT=norm([t.t,t.r,t.e,t.def,t.x].join(' '));
    t.hay=norm([t.t,t.r,t.e,t.def,t.x,t.s,t.b,...t.v.map(v=>v.title+' '+v.n)].join(' '));
    t.v.forEach(v=>{if(!V.has(v.id))V.set(v.id,{title:v.title,techs:[],hay:''});const e=V.get(v.id);if(!e.techs.some(x=>x.i===i))e.techs.push({i,n:v.n});e.hay+=' '+norm(v.title)});
  });
  T.forEach(t=>{t.rel=((J[t.t]||{}).rel||[]).filter(n=>BY.has(n)&&n!==t.t)});
  $('stat').textContent='手法'+T.length+'・作例'+V.size+'本を収録。';
  render();
  if(location.hash)goHash();
}).catch(()=>{$('main').innerHTML='<p class="empty">データを読み込めませんでした。ページを再読み込みしてください。</p>'});
}
</script>
</body>
</html>
